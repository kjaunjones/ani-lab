<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--SEO Meta Tags -->
    <meta name="keywords" content="Anime, Manga, Trending Anime, Latest Anime, Latest Manga">
    <meta name="description" content="Discover trending anime, explore manga, and search for your next favourite series with ANI-LAB.">
    <!--STYLESHEET-->
    <link rel="stylesheet" href="css/style.css">
    <!--FONT AWESOME-->
    <script src="https://kit.fontawesome.com/0010c1b56c.js" crossorigin="anonymous"></script>
    <title>ANI-LAB</title>
</head>
<body>
    <!--HEADER AND NAVIGATION-->
    <header>
        <nav aria-label="Main navigation">
            <h1 class="site-logo">
                <a href="#hero">ANI-LAB</a>
            </h1>
            <!-- Mobile navigation toggle -->
            <button class="menu-toggle" type="button"
                aria-label="Toggle navigation menu"
                aria-expanded="false"
                aria-controls="nav-links">
                <i class="fa-solid fa-bars" aria-hidden="true"></i>
            </button>
            <!-- Navigation links -->
            <ul id="nav-links">
                <li>
                    <a href="#hero">Home</a>
                </li>
                <li>
                    <a href="#trending">Trending</a>
                </li>
                <li>
                    <a href="#latest-anime">Latest Anime</a>
                </li>
                <li>
                    <a href="#latest-manga">Latest Manga</a>
                </li>
                <!-- Search form: desktop navbar / mobile menu -->
                <li class="nav-search">
                    <form id="search-form" role="search">
                        <input type="search" id="search-input" name="search" placeholder="Search anime or manga..."
                         aria-label="Search anime or manga"
                            required>
                        <select id="search-type"
                            name="media-type"
                            aria-label="Choose media type">
                            <option value="anime">Anime</option>
                            <option value="manga">Manga</option>
                        </select>

                        <button type="submit" aria-label="Search anime or manga">
                            <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                    </button>
                    </form>
                </li>
            </ul>
        </nav>
    </header>
<main>
    <!-- HERO SECTION -->
<section id="hero">
    <div class="hero-content">
        <h2 class="hero-title">
            Welcome to ANI-LAB — discover your next favorite anime and manga series!
        </h2>
        <p>
            Discover the latest updates and trending titles in anime and manga.
        </p>
        <button class="anime-btn" type="button">
            Explore Anime
        </button>
        <button class="manga-btn" type="button">
            Explore Manga
        </button>
    </div>
</section>

    <section id="search">
        <h2>Search Anime and Manga</h2>

        <form id="search-form">
            <button type="submit">Search</button>
        </form>
        <div class="content-grid" id="search-results"></div>
            
    </section>

    <section id="trending">

        <h2>Trending Anime and Manga</h2>

        <div class="content-grid" id="trending-grid"> <!--to hold multiple cards-->
            
        </div>
    </section>
    <section id="latest-anime">
        <h2>Latest Anime</h2>
        <div class="content-grid" id="anime-grid">
            
        </div>
    </section>
    <section id="latest-manga">
        <h2>Latest Manga</h2>
        <div class="content-grid" id="manga-grid">
            
        </div>
    </section>
</main>
    <footer></footer>
    <script src="js/script.js"></script>
    
</body>
</html>
