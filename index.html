<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://kit.fontawesome.com/0010c1b56c.js" crossorigin="anonymous"></script>
    <title>ANI-LAB</title>
</head>
<body>
    <header>
        <nav>
            <h1>ANI-LAB</h1>
            <button class="menu-toggle" aria-label="Toggle menu" type="button" aria-expanded="false" aria-controls="nav-links">
                <i class="fa-solid fa-bars"></i>
            </button>
            <ul id="nav-links">
                <li><a href="#hero">Home</a></li>
                <li><a href="#trending">Trending</a></li>
                <li><a href="#latest-anime">Latest Anime</a></li>
                <li><a href="#latest-manga">Latest Manga</a></li>
            </ul>
        </nav>
    </header>
<main>
    <section id="hero">
        <div class="hero-content">
            <h2 class="hero-title">Welcome to ANI-LAB discover your next favorite anime and manga series!</h2>
            <p>Discover the latest updates and trending titles in anime and manga</p>
            <button class="anime-btn" type="button">Explore Anime</button> <button class="manga-btn" type="button">Explore Manga</button>
        </div>
    </section>
    <section id="trending">

        <h2>Trending Anime and Manga</h2>

        <div class="content-grid" id="trending-grid"> <!--to hold multiple cards-->
            
        </div>
    </section>
    <section id="latest-anime">
        <h2>Latest Anime</h2>
        <div class="content-grid" id="anime-grid">
            
        </div>
    </section>
    <section id="latest-manga">
        <h2>Latest Manga</h2>
        <div class="content-grid" id="manga-grid">
            
        </div>
    </section>
</main>
    <footer></footer>
    <script src="js/script.js"></script>
    
</body>
</html>
